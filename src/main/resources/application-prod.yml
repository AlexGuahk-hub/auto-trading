spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/trading
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  redis:
    host: redis
    port: 6379
    password: ${REDIS_PASSWORD}
  data:
    redis:
      repositories:
        enabled: false

logging:
  level:
    com.trading: INFO
    root: WARN
